name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  modules:
    runs-on: ubuntu-latest
    outputs:
      list: ${{ steps.find.outputs.list }}
    steps:
      - uses: actions/checkout@v5
      - id: find
        run: echo "list=$(find . -name go.mod -not -path './.git/*' -exec dirname {} \; | sort | jq -R . | jq -cs .)" >> "$GITHUB_OUTPUT"

  test:
    needs: modules
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJSON(needs.modules.outputs.list) }}
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: ${{ matrix.module }}/go.mod
      - run: go mod tidy -diff
      - run: go vet ./...
      - run: go test -race -count=1 ./...
      - uses: golangci/golangci-lint-action@v8
        with:
          working-directory: ${{ matrix.module }}
